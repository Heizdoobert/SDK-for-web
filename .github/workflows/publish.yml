name: Publish

# Publishes to GitHub Packages on a v*.*.* tag. Run it by hand (Actions > Publish)
# to publish the version already in package.json, e.g. one that was tagged before this existed.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v${v}"; exit 1; }
      # No lockfile is committed, so npm ci is not an option.
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
